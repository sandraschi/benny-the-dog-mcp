[project]
name = "benny_the_dog_mcp"
version = "0.1.0"
description = "Benny the dog health and care monitor - water bowls, movement, loneliness detection, sausage deliveries, projector movie time, wake calls. Boomy-robot patrol integration ready."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp[tasks]>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "APScheduler>=3.10,<4",
]

[project.scripts]
benny_the_dog_mcp-server = "benny_the_dog_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]