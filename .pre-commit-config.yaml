repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: biome
        name: biome (webapp)
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/pre-commit-biome.ps1
        language: system
        files: ^webapp/.*\.(ts|tsx|js|jsx|json)$
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
